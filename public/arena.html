<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SQL Arena — DuckDB / SQLite / PGlite 同场 PK</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", sans-serif;
         margin: 0; padding: 18px; max-width: 1280px; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  h2 { font-size: 14px; margin: 0 0 8px; font-weight: 600; color: #444; }
  .lead { color: #666; margin: 0 0 16px; font-size: 13px; }
  .panel { border: 1px solid #ddd; border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; background: #fff; }
  textarea { width: 100%; min-height: 108px; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
             padding: 10px; border: 1px solid #ccc; border-radius: 6px; resize: vertical;
             background: #fbfbfb; color: #111; tab-size: 2; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid #999;
           background: #fff; cursor: pointer; }
  button.primary { background: #1f6feb; color: #fff; border-color: #1f6feb; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .hint { color: #777; font-size: 12px; }
  select, input[type=file] { font: inherit; padding: 5px; border-radius: 6px; border: 1px solid #bbb; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid #e2e2e2; padding: 6px 9px; text-align: right;
           font-variant-numeric: tabular-nums; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { background: #f6f7f9; font-weight: 600; position: sticky; top: 0; }
  .scroll { overflow-x: auto; max-height: 320px; overflow-y: auto; border-radius: 6px; }
  .ok { color: #157f3d; font-weight: 600; }
  .bad { color: #b42318; font-weight: 600; }
  .warn { color: #9a6700; font-weight: 600; }
  .muted { color: #888; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
  .card { border: 1px solid #e2e2e2; border-radius: 8px; padding: 10px 12px; }
  .card .name { font-weight: 600; }
  .card .time { font-size: 22px; font-variant-numeric: tabular-nums; margin: 2px 0; }
  .card .meta { font-size: 12px; color: #777; }
  .card.failed { border-color: #f0c2bd; background: #fff8f7; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 11px; font-weight: 600; }
  .pill.ok { background: #e6f4ea; color: #157f3d; }
  .pill.bad { background: #fde8e6; color: #b42318; }
  .pill.warn { background: #fff4d6; color: #9a6700; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .tabs button { border-radius: 99px; padding: 4px 12px; font-size: 13px; }
  .tabs button[aria-selected="true"] { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  pre.sql { background: #111; color: #e6e6e6; padding: 8px 10px; border-radius: 6px; font-size: 12px;
            overflow-x: auto; margin: 6px 0 0; }
  .bar { height: 6px; border-radius: 3px; background: #1f6feb; }
  .dslist { font-size: 12px; }
  .dslist li { margin: 2px 0; }
</style>
</head>
<body>

<h1>SQL Arena</h1>
<p class="lead">
  同一个浏览器里，三个引擎导入同一份数据、执行同一句 SQL。数据你自己传，SQL 你自己写。
  类型由页面统一推断后分发给三家，避免「字符串比较 vs 数值比较」造成的假分歧。
</p>

<div class="panel">
  <h2>1. 数据</h2>
  <div class="row">
    <input type="file" id="files" multiple accept=".csv,text/csv" />
    <button id="demo">载入内置示例（TPC-H 5 表）</button>
    <span class="hint" id="dsinfo">尚未加载数据</span>
  </div>
  <ul class="dslist" id="dslist"></ul>
</div>

<div class="panel">
  <h2>2. SQL</h2>
  <textarea id="sql" spellcheck="false">SELECT n.n_name AS nation, r.r_name AS region, count(*) AS orders
FROM orders o
JOIN customer c ON o.o_custkey = c.c_custkey
JOIN nation n ON c.c_nationkey = n.n_nationkey
JOIN region r ON n.n_regionkey = r.r_regionkey
GROUP BY n.n_name, r.r_name
ORDER BY orders DESC
LIMIT 5</textarea>
  <div class="row">
    <button class="primary" id="run" disabled>▶ 在三个引擎上执行</button>
    <button id="explain" disabled>执行计划</button>
    <label class="hint"><input type="checkbox" id="warm" checked /> 先热身一次，只计稳态耗时</label>
    <span class="hint" id="status"></span>
  </div>
  <div class="row hint">
    示例：<a href="#" data-q="select-1">单表聚合</a> ·
    <a href="#" data-q="join">四表 JOIN</a> ·
    <a href="#" data-q="window">窗口函数</a> ·
    <a href="#" data-q="cte">CTE + 子查询</a>
  </div>
</div>

<div class="panel">
  <h2>3. 结果</h2>
  <div id="cards" class="cards"></div>
  <div id="verdict" style="margin-top:12px"></div>
  <div class="tabs" id="tabs" style="margin-top:12px"></div>
  <div class="scroll" id="tablewrap"><div class="muted" style="padding:8px">执行后显示各引擎结果</div></div>
</div>

<script type="importmap">
{
  "imports": {
    "apache-arrow": "/node_modules/apache-arrow/Arrow.dom.mjs",
    "apache-arrow/": "/node_modules/apache-arrow/",
    "tslib": "/node_modules/tslib/tslib.es6.mjs",
    "flatbuffers": "/node_modules/flatbuffers/mjs/flatbuffers.js"
  }
}
</script>
<script type="module" src="./arena.js"></script>
</body>
</html>
