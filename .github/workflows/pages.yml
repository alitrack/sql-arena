name: pages

# GitHub Pages requires a public repository on this plan; the build job is
# skipped while the repo stays private. When made public, the site is staged
# under `dist/` with the same directory layout as the repo, because the pages
# import `/src/*.js`, `/node_modules/*` and `/public/vendor/*` by absolute path.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Stage the site with the repo's own layout
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -r public dist/public
          cp -r src dist/src
          ./scripts/fetch-vendor.sh
          cp -r public/vendor dist/public/vendor

          # Only these five packages are requested at runtime; copying the whole
          # node_modules tree would ship ~120 MB of build-only dependencies.
          mkdir -p dist/node_modules/@electric-sql dist/node_modules/@sqlite.org
          for pkg in apache-arrow flatbuffers tslib; do
            cp -r "node_modules/$pkg" "dist/node_modules/$pkg"
          done
          cp -r node_modules/@electric-sql/pglite dist/node_modules/@electric-sql/pglite
          cp -r node_modules/@sqlite.org/sqlite-wasm dist/node_modules/@sqlite.org/sqlite-wasm

          # Pages runs Jekyll by default, which drops paths starting with an
          # underscore; disable it.
          touch dist/.nojekyll

          # The site is served from /<repo>/, so the landing page lives at the
          # dist root. Paths inside the pages are relative, which is what lets
          # the same files work both at a domain root and under a prefix.
          cp public/index.html dist/index.html

          # The arena loads its demo tables from /data; ship only the small ones.
          mkdir -p dist/data
          for f in orders_20k.csv lineitem_20k.csv customer_20k.csv nation.csv region.csv; do
            cp "data/$f" "dist/data/"
          done

      - name: Report the staged size
        run: du -sh dist && find dist -type f | wc -l

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4